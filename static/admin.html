<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匿名質問箱 - 管理者</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>管理者パネル</h1>
        <form id="loginForm">
            <input id="passwordInput" type="password" placeholder="パスワード" required>
            <button type="submit">ログイン</button>
        </form>
        <div class="admin-buttons" id="controls" hidden>
            <button id="startButton" type="button">質問開始</button>
            <button id="endButton" type="button" class="secondary">終了</button>
        </div>
        <p id="status"></p>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
